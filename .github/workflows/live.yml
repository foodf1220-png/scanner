name: 실시간 급등주 신호

# Cloudflare Worker 가 매일 장 시작 5분 전(뉴욕 09:25)에 실행. 수동 실행도 가능
on:
  workflow_dispatch:

concurrency:
  group: live-signal          # 같은 날 두 번 겹쳐 돌지 않게
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치 (yfinance, pandas)
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: 실시간 신호 감시 (장 시작 ~ 뉴욕 11:30, 신호 즉시 텔레그램)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --live
